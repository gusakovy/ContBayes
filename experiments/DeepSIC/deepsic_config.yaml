general:
  version: 1.0
  seed: 0
  device: 'cpu'

channel:
  channel_type: 'Cost2100'                                      # 'Cost2100' / 'Synthetic'
  linear: False                                                 # True / False
  num_users: 4
  num_antennas: 4
  fading_coefficient: 0.65                                      # 0 <= fading_coefficient <= 1
  warm_start_snr: 9
  tracking_snr: [8, 9, 10, 11, 12]
  constellation: 'QPSK'                                         # 'BPSK' / 'QPSK'
  num_blocks: 75

warm_start:
  training_lr: 0.0005
  training_epochs: 80
  training_dim: 2048
  training_batch_size: 32
  test_dim: 100000

deepsic:
  num_layers: 4
  hidden_size: 6

tracking:
  tracking_method: ['Pre-train', 'EKF', 'LF-VCL', 'CL']         # 'Pre-train' / 'EKF' / 'LF-VCL' / 'CL' / 'Retrain'
  num_pilots: 128
  num_epochs: [4, 20]
  num_batches: 1
  tracking_lr: 0.0005

ekf:
  state_model: 1
  process_noise_var: 0.000001
  update_limit: 0.1
  diag_loading: 0
  reduction: 'label'                                            # 'label' / null
  normalization: 'mean'                                         # 'mean' (only if reduction='label') / null
